name: tests

# 测试套件不加载真实模型、不联网（云端全部 mock），重 ASR 依赖惰性导入，
# 因此用 requirements-ci.txt 的精简依赖即可，在数分钟内跑完。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run test suite
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          fail=0
          for t in tests/test_*.py; do
            echo "=== $t ==="
            if ! python -X utf8 "$t"; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi

      - name: Validate inline UI JavaScript syntax
        shell: bash
        run: |
          node --version
          node -e 'const fs=require("fs");const html=fs.readFileSync("ui/index.html","utf8");const re=/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g;let m,i=0,bad=0;while((m=re.exec(html))){i++;try{new Function(m[1]);}catch(e){bad++;console.log("SCRIPT#"+i+" SYNTAX ERROR:",e.message);}}console.log("scripts checked:"+i+", errors:"+bad);process.exit(bad?1:0);'
