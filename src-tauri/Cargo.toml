[package]
name = "newmeetingrecorder"
version = "3.1.0"
description = "会议录音转写助手桌面壳 (Tauri 2)"
authors = ["zshanwei2019"]
edition = "2021"
rust-version = "1.77.2"

# 见 tauri.conf.json：productName = NewMeetingRecorder，
# 打包后的主程序名来自 productName（NewMeetingRecorder.exe）。

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon feature 开启 tauri::tray（Tauri 2 中托盘模块默认 feature gate）；
# image-png 让 Image::from_bytes 能解码 PNG（托盘图标兜底路径用）。
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# 系统托盘为 tauri::tray 内置，无需额外插件。
# 单实例：第二次启动聚焦已有窗口，而非开新进程。
tauri-plugin-single-instance = { version = "2", features = [] }
# 桌面通知：提供 Rust 侧发通知能力 + notify 命令，供 sidecar 事件后续调用。
tauri-plugin-notification = { version = "2", features = [] }

# Windows Job Object：把 PyInstaller onefile sidecar 的整棵进程树（bootloader→服务进程）
# 挂进 KILL_ON_JOB_CLOSE 作业，壳退出/崩溃时由系统连孙进程一起回收，杜绝孤儿占端口。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
# 减小壳体积；sidecar 是独立的 asr-server.exe，壳本身很轻。
strip = true
